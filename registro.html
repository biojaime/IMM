<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaderoChecker - Registro</title>
  <link rel="icon" type="image/png" href="ICONO%20Madero.png">
  <link rel="apple-touch-icon" href="ICONO%20Madero.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Floating checkered flag decorations from Canva design -->
  <img src="./home_files/db2c647cf06bb10a8906a80f06464546.png" class="bg-decoration bg-decoration-1" alt="decoracion">
  <img src="./home_files/db2c647cf06bb10a8906a80f06464546.png" class="bg-decoration bg-decoration-2" alt="decoracion">
  <img src="./home_files/db2c647cf06bb10a8906a80f06464546.png" class="bg-decoration bg-decoration-3" alt="decoracion">
  <img src="./home_files/db2c647cf06bb10a8906a80f06464546.png" class="bg-decoration bg-decoration-4" alt="decoracion">

  <!-- Notification system -->
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-container">
    <div class="auth-card">
      <img src="https://immsec.neocities.org/IMM/IMM.png" class="auth-logo" alt="Logo IMM">
      <h2 class="auth-title">Crear Cuenta</h2>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="fullname" class="form-label">Nombre Completo</label>
          <input type="text" id="fullname" class="form-input" placeholder="Ej. Juan Pérez" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="username" class="form-label">Matrícula / Usuario</label>
          <input type="text" id="username" class="form-input" placeholder="Ej. 202612345" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-input" placeholder="Crea tu contraseña" required autocomplete="new-password">
        </div>
        
        <button type="submit" id="btn-register" class="btn-primary">
          <span class="btn-text">Enviar Solicitud</span>
        </button>
      </form>
      
      <a href="index.html" class="back-link">¿Ya tienes cuenta? Inicia Sesión</a>
    </div>
  </div>

  <!-- Load Firebase Compat SDK scripts (allows loading via file:// protocol without CORS errors) -->
  <script src="pwa.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Load Firebase init config -->
  <script src="firebase-init.js"></script>

  <!-- Register Logic -->
  <script>
    const registerForm = document.getElementById("register-form");
    const btnRegister = document.getElementById("btn-register");
    const toastContainer = document.getElementById("toast-container");

    // Custom toast manager
    function showToast(message, type = "error") {
      const toast = document.createElement("div");
      toast.className = `toast ${type === "error" ? "toast-error" : "toast-success"}`;
      toast.innerHTML = `
        <span>${message}</span>
        <span style="cursor:pointer; margin-left: 10px; font-weight: bold;" onclick="this.parentElement.remove()">×</span>
      `;
      toastContainer.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add("slide-out");
        toast.addEventListener("animationend", () => {
          toast.remove();
        });
      }, 4000);
    }

    // Register Submit handler
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const fullName = document.getElementById("fullname").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!fullName || !username || !password) {
        showToast("Por favor, completa todos los campos.");
        return;
      }

      // Show loader
      const originalText = btnRegister.innerHTML;
      btnRegister.disabled = true;
      btnRegister.innerHTML = `<div class="spinner"></div>`;

      try {
        // 1. Check if the username is already registered as an Admin
        const adminSnapshot = await db.collection("Admin").where("Usuario", "==", username).get();

        if (!adminSnapshot.empty) {
          showToast("Esta matrícula/usuario está reservada para administración.");
          btnRegister.disabled = false;
          btnRegister.innerHTML = originalText;
          return;
        }

        // 2. Check if username is already registered as a User (Usuarios)
        const userSnapshot = await db.collection("Usuarios").where("Usuario", "==", username).get();

        if (!userSnapshot.empty) {
          showToast("Esta matrícula/usuario ya se encuentra registrada como activa.");
          btnRegister.disabled = false;
          btnRegister.innerHTML = originalText;
          return;
        }

        // 3. Check if there's already a pending request with this username in Solicitudes
        // We check both lowercase "matricula" and capitalized "Usuario" / "Matricula"
        const requestSnapshot1 = await db.collection("Solicitudes").where("matricula", "==", username).get();
        const requestSnapshot2 = await db.collection("Solicitudes").where("Usuario", "==", username).get();

        if (!requestSnapshot1.empty || !requestSnapshot2.empty) {
          showToast("Ya existe una solicitud pendiente de aprobación para esta matrícula.");
          btnRegister.disabled = false;
          btnRegister.innerHTML = originalText;
          return;
        }

        // 4. Create registration request in the Solicitudes collection
        // Store variations of field names to guarantee compatibility with how they view it in Firestore
        await db.collection("Solicitudes").add({
          "nombre completo": fullName,
          "NombreCompleto": fullName,
          "Nombre": fullName,
          "matricula": username,
          "Matricula": username,
          "Usuario": username,
          "contraseña": password,
          "Contraseña": password,
          "FechaRegistro": new Date().toISOString()
        });

        showToast("¡Solicitud enviada con éxito! Espera a que el administrador apruebe tu cuenta.", "success");
        registerForm.reset();

        setTimeout(() => {
          window.location.href = "index.html";
        }, 3000);

      } catch (error) {
        console.error("Register Error:", error);
        showToast("Error al enviar la solicitud: " + error.message);
        btnRegister.disabled = false;
        btnRegister.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
